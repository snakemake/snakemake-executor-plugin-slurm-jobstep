[project]
name = "snakemake-executor-plugin-slurm-jobstep"
version = "0.6.1"
description = "A Snakemake executor plugin for running srun jobs inside of SLURM jobs (meant for internal use by snakemake-executor-plugin-slurm)"
readme = "README.md"
requires-python = ">=3.11,<4"
license = {text = "MIT"}
authors = [
    {name = "Christian Meesters", email = "meesters@csc.uni-frankfurt.de"},
    {name = "David Lähnemann", email = "david.laehnemann@dkfz-heidelberg.de"},
    {name = "Johannes Koester", email = "johannes.koester@uni-due.de"},
]
keywords = ["snakemake", "plugin", "executor", "cluster", "slurm"]
dependencies = [
    "snakemake-interface-common>=1.17.4,<2",
    "snakemake-interface-executor-plugins>=9.3.2,<10",
]

[project.urls]
Repository = "https://github.com/snakemake/snakemake-executor-plugin-slurm-jobstep"
Documentation = "https://snakemake.github.io/snakemake-plugin-catalog/plugins/executor/slurm-jobstep.html"

[tool.coverage.run]
omit = [".*", "*/site-packages/*", "Snakefile"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "tests.py"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
snakemake-executor-plugin-slurm-jobstep = { path = "." }

[tool.pixi.environments]
dev = { features = ["test", "style"] }
quality = { features = ["style"] }
test = { features = ["test"] }
publish = { features = ["build"] }

[tool.pixi.feature.test.pypi-dependencies]
pytest = ">=7.4.2,<10"
coverage = ">=7.3.1,<8"
snakemake = ">=9.1.1,<10"

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest", default-environment = "test" }
coverage-report = { cmd = "coverage run -m pytest tests/tests.py && coverage report -m", default-environment = "test" }

[tool.pixi.feature.style.pypi-dependencies]
black = ">=25.12.0,<27"
flake8 = ">=6.1,<8"

[tool.pixi.feature.style.tasks]
format = { cmd = "black", default-environment = "quality" }
lint = { cmd = "flake8", default-environment = "quality" }

[tool.pixi.feature.build.pypi-dependencies]
build = "*"
twine = "*"

[tool.pixi.feature.build.tasks]
build-check = { cmd = "python -m build && twine check dist/*" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
